# « keycloak:8080 » pour les services (cles de signature des jetons), et
# l'Ingress pour l'exterieur. Le port 9000 (sante) reste interne.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
