# Keycloak en mode production, derriere l'Ingress, sous le chemin /auth.
#
# Le TLS s'arrete a l'Ingress : Keycloak parle HTTP dans le cluster et lit le
# schema et l'hote d'origine dans les en-tetes X-Forwarded-*. L'URL publique
# du realm « ecommerce » devient l'issuer de ses jetons : la gateway attend
# exactement la meme.
#
# Au premier demarrage, sur une base vide, il importe le realm du ConfigMap
# « keycloak-realm », et SEULEMENT lui : jamais le fichier des comptes de
# demonstration du back-end.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  # Jamais deux instances a la fois : avec un cache local, elles ne
  # partageraient pas les sessions, et un pic de deploiement doublerait sa part
  # du quota.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        # L'utilisateur « keycloak » de l'image (uid 1000).
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          # Meme image que le Docker Compose local.
          image: quay.io/keycloak/keycloak:26.0
          args: ["start", "--import-realm"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: PUBLIC_URL
            # --- Serveur ---
            # L'adresse propre du serveur est celle du port-forward : c'est
            # celle du realm « master » et de la console d'administration, qui
            # ne sont pas publies (voir l'Ingress). L'adresse publique est
            # portee par le realm « ecommerce » lui-meme (frontendUrl, plus
            # bas) : issuer, pages de connexion et liens des emails.
            - name: KC_HOSTNAME
              value: http://localhost:8180/auth
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # La gateway recupere les cles sur http://keycloak:8080 : les URL
            # de ce canal interne suivent l'adresse appelee, pas KC_HOSTNAME.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Une seule instance : pas de cache distribue a decouvrir.
            - name: KC_CACHE
              value: local
            # --- Base de donnees ---
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: KEYCLOAK_DB_PASSWORD
            # --- Compte d'administration initial, cree sur une base vide ---
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            # --- Lues par le realm importe, via ses expressions ${...} ---
            # L'URL publique du realm « ecommerce » : elle devient l'issuer de
            # ses jetons, celui qu'attend la gateway.
            - name: KEYCLOAK_FRONTEND_URL
              value: "$(PUBLIC_URL)/auth"
          envFrom:
            # SMTP_HOST, SMTP_PORT, SMTP_FROM, SMTP_USER, SMTP_PASSWORD :
            # obligatoire, le realm exige la verification des emails.
            - secretRef:
                name: keycloak-smtp
            # GOOGLE_* et APPLE_* : facultatif, les deux fournisseurs sont
            # importes desactives.
            - secretRef:
                name: keycloak-idp
                optional: true
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          # Le mode production recompile sa configuration a chaque demarrage :
          # une a deux minutes avec peu de CPU.
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
