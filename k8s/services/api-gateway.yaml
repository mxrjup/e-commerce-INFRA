# La gateway : seul point d'entree de l'API, derriere l'Ingress (/api).
# Elle valide les jetons Keycloak, applique les regles de roles et pose
# X-Auth-Subject avant de router vers les services.
#
# L'image vient de GHCR, construite par la CI du back-end (D03, #54). Le tag
# deploye se fixe a un seul endroit : la section « images » de
# k8s/kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      # Images privees sur GHCR : Secret de type docker-registry, voir le
      # README. Absent, le kubelet tente un pull anonyme.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # L'utilisateur « spring » du Dockerfile du back-end (uid 100,
        # gid 101) : l'image le declare par son nom, que Kubernetes ne peut
        # pas verifier sans uid numerique.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: ghcr.io/mxrjup/e-commerce-back/api-gateway
          # Tag mobile (dev) : sans Always, un redemarrage reprendrait l'image
          # deja presente sur le noeud. A revoir avec un tag immuable (D05).
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: PUBLIC_URL
            # L'issuer est l'URL publique, celle que contient le jeton ; les
            # cles se recuperent sur l'adresse interne de Keycloak.
            - name: KEYCLOAK_ISSUER_URI
              value: "$(PUBLIC_URL)/auth/realms/ecommerce"
            - name: KEYCLOAK_JWK_SET_URI
              value: http://keycloak:8080/auth/realms/ecommerce/protocol/openid-connect/certs
            - name: CART_SERVICE_URI
              value: http://cart-service:8083
            - name: ORDER_SERVICE_URI
              value: http://order-service:8084
            # Le back-office est servi sur le meme hote : c'est sa seule
            # origine. L'app mobile, native, n'est pas soumise au CORS.
            - name: CORS_ALLOWED_ORIGINS
              value: "$(PUBLIC_URL)"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        # Le systeme de fichiers est en lecture seule : /tmp seul est
        # inscriptible.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
