# Le serveur MCP : outils de lecture du catalogue, des commandes et des
# utilisateurs pour un assistant, et son administration (/api/admin/mcp).
# Le transport (/mcp, /sse) passe par la gateway, qui laisse mcp-service
# verifier le jeton MCP. Pas de profil « demo-stock » en deploye.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-service
  labels:
    app: mcp-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mcp-service
        tier: backend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-service
          image: ghcr.io/mxrjup/e-commerce-back/mcp-service
          # Tag mobile (dev) tant que kustomization.yaml le fixe ; le
          # deploiement par tag (deploy.sh du back-end) pose un digest.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ecommerce_mcp
            - name: SPRING_DATASOURCE_USERNAME
              value: mcp_service
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: MCP_DB_PASSWORD
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8081
            - name: ORDER_SERVICE_URL
              value: http://order-service:8084
            - name: USER_SERVICE_URL
              value: http://user-service:8082
            # Cle partagee des lectures internes (X-Internal-Key) entre services.
            - name: MCP_USERS_READ_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-read-key
                  key: MCP_USERS_READ_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 400m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-service
  labels:
    app: mcp-service
spec:
  selector:
    app: mcp-service
  ports:
    - name: http
      port: 8087
      targetPort: http
