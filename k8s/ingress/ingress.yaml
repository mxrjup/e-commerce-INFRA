# Un seul hote public pour toute la plateforme :
#
#   /api/**                     -> la gateway
#   /mcp/**, /sse               -> la gateway, transport MCP
#   /auth/realms/ecommerce/**   -> Keycloak : connexion, jetons, cles, compte
#   /auth/resources/**          -> Keycloak : styles et scripts des pages
#   /** (tout le reste)         -> le back-office web, et les pages de retour
#                                  Stripe de l'application mobile
#
# Ni la console d'administration (/auth/admin) ni le realm « master », celui
# des administrateurs, ne sont publies : on y accede par « kubectl
# port-forward », donc avec les droits du kubeconfig. Publier /auth/realms en
# entier exposerait la connexion admin a tout internet.
#
# L'hote est un parametre : k8s/params.env, reporte ici par kustomize.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce
  annotations:
    # Le seul emetteur de certificats qui fonctionne dans le namespace de
    # l'ecole : cert-manager cree et renouvelle seul le certificat Let's
    # Encrypt de l'hote.
    cert-manager.io/cluster-issuer: letsencrypt-etudiants
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - PUBLIC_HOST
      # Le Secret du certificat deja emis pour cet hote par l'ecole (il
      # servait le nginx d'accueil) : cert-manager le reprend et le renouvelle,
      # sans nouvelle emission.
      secretName: nginx-tls
  rules:
    - host: PUBLIC_HOST
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          # Transport MCP (Streamable HTTP et SSE), route par la gateway vers
          # mcp-service, qui verifie lui-meme le jeton MCP.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /sse
            pathType: Exact
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /auth/realms/ecommerce
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /auth/resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          # Le plus court prefixe : ne recoit que ce qu'aucune regle plus
          # precise ne prend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-backoffice
                port:
                  name: http
