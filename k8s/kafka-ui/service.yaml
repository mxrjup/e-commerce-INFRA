# ClusterIP seulement : Kafka UI se consulte par port-forward, jamais par un
# Ingress (voir deployment.yaml).
#
#   kubectl port-forward svc/kafka-ui 8090:8080   # puis http://localhost:8090
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels:
    app: kafka-ui
spec:
  type: ClusterIP
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
