# Une base par service, plus celle de Keycloak. Meme liste que
# e-commerce-BACK/docker/postgres/init/01-databases.sql : un nouveau service
# s'ajoute dans les deux.
#
# Le script ne tourne qu'au PREMIER demarrage, sur un volume vide. Sur un
# Postgres deja initialise, creer la base a la main :
#
#   kubectl exec postgres-0 -- psql -U postgres -c 'CREATE DATABASE ecommerce_xxx'
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    app: postgres
data:
  01-databases.sql: |
    CREATE DATABASE keycloak;
    CREATE DATABASE ecommerce_cart;
    CREATE DATABASE ecommerce_order;
